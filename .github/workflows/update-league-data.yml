on:
  workflow_dispatch:
  schedule:
    # Tuesday morning after Monday Night Football.
    # GitHub cron uses UTC.
    - cron: "30 15 * * 2"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Yahoo Fantasy data
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_REDIRECT_URI: "https://localhost:8080/callback"
          YAHOO_LEAGUE_ID: "726144"
        run: python scripts/fetch_yahoo.py

      - name: Commit updated league data
        run: |
          git config user.name "fantasy-football-reporter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Yahoo fantasy league data"
            git push
          fi
